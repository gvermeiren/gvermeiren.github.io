<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leerpaden · voor docenten</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Figtree:wght@600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap">
<style>
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --sunk:#EAE8E1; --ink:#1D2024; --muted:#5A6068; --line:#D8D5CC;
  --accent:#2B4C7E; --accent-ink:#FFFFFF; --ok:#1B7F4B; --ok-bg:#DFF3E7; --nok:#B3261E; --nok-bg:#FBE3E0; --goud:#E8A91C; --goud-ink:#3A2700;
  --f:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fd:"Figtree", "Segoe UI", system-ui, sans-serif; --fm:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121417; --surface:#1B1E23; --sunk:#252930; --ink:#ECEEF1; --muted:#A2A9B3; --line:#31363E;
  --accent:#8FB4EE; --accent-ink:#0B1626; --ok:#6AD49B; --ok-bg:#153324; --nok:#FF9A8C; --nok-bg:#3B1C1A; --goud:#F2BE45; --goud-ink:#2E2100; color-scheme:dark }}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f);-webkit-text-size-adjust:100%}
.wrap{max-width:1040px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{font-family:var(--fd);line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(30px,6vw,46px);font-weight:700}
h2{font-size:24px;font-weight:700;margin:40px 0 6px}
h3{font-size:19px;font-weight:700}
p{margin:0 0 10px}
a{color:var(--accent)}
.sub{color:var(--muted);margin-bottom:16px}
.klein{font-size:14.5px;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.merk{display:flex;align-items:center;gap:10px;font:700 19px var(--fd);color:var(--ink);text-decoration:none}
.merk i{display:flex;gap:3px}
.merk i b{width:11px;height:22px;border-radius:6px;display:block}
.toplink{font-size:15px;color:var(--muted)}
.hero p{font-size:18px;color:var(--muted);max-width:60ch;margin-top:10px}
.koppen{display:flex;margin:18px 0 6px}
.koppen span{margin-left:-10px;border-radius:50%;box-shadow:0 0 0 3px var(--bg);display:flex}
.koppen span:first-child{margin-left:0}
.koppen svg{display:block;border-radius:50%}

/* padkeuze */
.kies{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 6px;padding:0;border:0}
.kies legend{font:700 13px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding:0}
.kies button{font:700 16px var(--f);padding:11px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:46px}
.kies button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* cijfers */
.cijfers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 4px}
.cijfer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.cijfer b{display:block;font:700 26px var(--fd);line-height:1.1}
.cijfer span{font-size:13.5px;color:var(--muted)}

/* labkaarten */
.labs{display:grid;gap:16px;grid-template-columns:1fr;margin-top:14px}
@media (min-width:880px){.labs{grid-template-columns:repeat(3,1fr)}}
.lab{--la:var(--accent);background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--la);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lab .kop{display:flex;align-items:center;gap:10px}
.lab .kop .logo{color:var(--la);display:flex;flex:none}
.lab .kop .logo svg{width:30px;height:30px}
.lab .kop .tegen{margin-left:auto;flex:none;display:flex}
.lab .kop .tegen svg{height:40px;width:auto}
.lab .thema{color:var(--muted);font-size:15.5px;margin:-6px 0 0}
.gids{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:12px;padding:8px 10px;font-size:15px}
.gids svg{width:40px;height:40px;flex:none;border-radius:50%;display:block}
.gids b{display:block;line-height:1.2}
.balk{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.balk i{display:block;height:100%;background:var(--la);border-radius:99px;min-width:0;transition:width .5s}
.stand{display:flex;justify-content:space-between;font-size:14.5px;color:var(--muted);margin-top:-6px}
.haltes{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;list-style:none;padding:0;margin:0}
.haltes li{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 12.5px var(--fm);color:var(--muted);position:relative;max-width:40px}
.haltes li.bezig{border-color:var(--la);color:var(--ink)}
.haltes li.af{background:var(--goud);border-color:var(--goud);color:var(--goud-ink)}
.knop{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px var(--f);padding:13px 18px;border-radius:12px;border:0;background:var(--la,var(--accent));color:#fff;text-decoration:none;cursor:pointer;min-height:50px;margin-top:auto;text-align:center}
.knop.stil{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.knop.klein2{min-height:42px;padding:8px 14px;font-size:15.5px;margin-top:0}
@media (prefers-color-scheme: dark){.lab .knop{color:#fff;filter:brightness(1.15)}}
.bewijs{display:flex;align-items:center;gap:8px;font-size:15px;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:8px 10px;font-weight:700}

/* paspoort */
.paspoort{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;overflow-x:auto}
.paspoort table{border-collapse:collapse;width:100%;min-width:520px}
.paspoort th{font:700 13px var(--f);text-align:left;color:var(--muted);padding:4px 6px;white-space:nowrap}
.paspoort td{padding:5px 3px;text-align:center}
.zegel{width:46px;height:46px;border-radius:50%;border:2px dashed var(--line);display:inline-grid;place-items:center;font:700 9.5px/1.05 var(--f);color:var(--muted);padding:3px;text-align:center;overflow:hidden;hyphens:manual}
.zegel.af{border:0;background:var(--goud);color:var(--goud-ink);transform:rotate(-6deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}

/* klas */
.klas{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.velden{display:grid;gap:12px;grid-template-columns:1fr;margin:12px 0}
@media (min-width:620px){.velden{grid-template-columns:1fr 1fr}}
label{font-weight:700;font-size:15.5px;display:block}
label small{font-weight:400;color:var(--muted);display:block}
input[type=text],textarea{width:100%;font:400 17px var(--f);padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-top:6px}
textarea{font:400 14px/1.4 var(--fm);min-height:110px;resize:vertical;word-break:break-all}
.code{font:400 14px/1.45 var(--fm);background:var(--sunk);border-radius:10px;padding:12px;word-break:break-all;margin:12px 0;user-select:all}
.rij{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.melding{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15.5px}
.melding.ok{background:var(--ok-bg);color:var(--ok)} .melding.nok{background:var(--nok-bg);color:var(--nok)}
.uitleg{display:grid;gap:10px;grid-template-columns:1fr;margin-top:10px;padding:0;list-style:none;counter-reset:st}
@media (min-width:760px){.uitleg{grid-template-columns:repeat(3,1fr)}}
.uitleg li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;counter-increment:st}
.uitleg li::before{content:counter(st);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 14px var(--fm);margin-bottom:8px}
.uitleg b{display:block}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted)}

/* docent */
.tabel{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tabel table{border-collapse:collapse;width:100%;min-width:640px;font-size:15.5px}
.tabel th,.tabel td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tabel th{font:700 13px var(--f);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tabel tr:last-child td{border-bottom:0}
.mini{display:flex;align-items:center;gap:8px;white-space:nowrap}
.mini .balk{width:74px;height:8px;flex:none}
.mini .balk i{background:var(--la)}
.stip{display:inline-flex;gap:2px;margin-left:2px}
.stip i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.stip i.af{background:var(--goud)}
.klascode{font:700 30px var(--fm);letter-spacing:.06em;background:var(--sunk);border-radius:12px;padding:10px 16px;display:inline-block}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button{font:700 15px var(--f);padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:42px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:6px 10px;border-radius:8px}
.leeg{padding:22px;color:var(--muted);text-align:center}
@media print{.geenprint{display:none!important} body{background:#fff} .tabel{border:0}}
#klas{text-transform:uppercase}
.tabel td:nth-child(2),.tabel td:nth-child(3){white-space:nowrap}

</style>

<div class="wrap" id="app"></div>

/* ===== Lab-hub: gedeelde functies (startpagina en docentenpagina) ===== */
const PADEN = ['jong', 'tiener', 'volw'];
const PADNAAM = {jong: '12–14 jaar', tiener: '15–18 jaar', volw: 'Volwassenen'};
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs || {})){
    if(v == null || v === false) continue;
    if(k === 'html') e.innerHTML = v; else if(k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for(const k of kids.flat()) if(k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const bewaard = (sleutel, standaard) => { try { const v = JSON.parse(localStorage.getItem(sleutel)); return v == null ? standaard : v; } catch(e){ return standaard; } };
const bewaar = (sleutel, v) => { try { localStorage.setItem(sleutel, JSON.stringify(v)); return true; } catch(e){ return false; } };

/* Voortgang van één lab en één pad, gelezen uit de opslag van dat lab (zelfde website, dus zelfde opslag). */
function voortgang(lab, pad){
  const s = bewaard(lab.sleutel, {}) || {};
  const klaar = (s.done && s.done[pad]) || {}, score = (s.score && s.score[pad]) || {};
  const ids = lab.haltes.flatMap(x => x.lessen);
  let goed = 0, tot = 0;
  for(const id of ids){ const [a, b] = String(score[id] || '').split('/').map(Number); if(b){ goed += a; tot += b; } }
  return maakVoortgang(lab, ids.map(id => !!klaar[id]), goed, tot);
}
function maakVoortgang(lab, bits, goed, tot){
  let i = 0;
  const haltes = lab.haltes.map(x => { const deel = bits.slice(i, i + x.lessen.length); i += x.lessen.length; return {naam: x.naam, n: deel.length, klaar: deel.filter(Boolean).length}; });
  const gedaan = bits.filter(Boolean).length;
  return {bits, haltes, gedaan, totaal: bits.length, haltesKlaar: haltes.filter(x => x.n && x.klaar === x.n).length, af: bits.length > 0 && gedaan === bits.length, goed, tot};
}

/* ---------- voortgangscode ----------
   Eén regel tekst met: klascode, schuilnaam, pad, datum en per lab welke lessen af zijn en de score.
   Er zit niets anders in. De code wordt nergens naartoe gestuurd; de leerling geeft ze zelf door. */
const b64 = {
  naar: t => btoa(String.fromCharCode(...new TextEncoder().encode(t))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  van: c => new TextDecoder().decode(Uint8Array.from(atob(c.replace(/-/g, '+').replace(/_/g, '/')), x => x.charCodeAt(0)))
};
const som = t => { let x = 7; for(const c of t) x = (x * 31 + c.charCodeAt(0)) % 46656; return x.toString(36).padStart(3, '0'); };
const bitsNaarHex = bits => { let uit = ''; for(let i = 0; i < bits.length; i += 4) uit += parseInt([0, 1, 2, 3].map(k => bits[i + k] ? 1 : 0).join(''), 2).toString(16); return uit; };
const hexNaarBits = (hex, n) => { const uit = []; for(const c of hex) uit.push(...parseInt(c, 16).toString(2).padStart(4, '0').split('').map(x => x === '1')); return uit.slice(0, n); };

function maakCode(klas, naam, pad){
  const labs = {};
  for(const lab of HUB.labs){ const v = voortgang(lab, pad); labs[lab.sleutel] = [bitsNaarHex(v.bits), v.goed, v.tot]; }
  const kern = b64.naar(JSON.stringify({k: klas, n: naam, p: pad, d: Math.floor(Date.now() / 86400000), l: labs}));
  return 'LAB1.' + kern + '.' + som(kern);
}
/* Geeft {klas, naam, pad, dag, labs:{sleutel: voortgang}} of gooit een fout met een leesbare boodschap. */
function leesCode(code){
  const m = String(code).trim().match(/^LAB1\.([A-Za-z0-9_-]+)\.([0-9a-z]{3})$/);
  if(!m) throw new Error('Dit is geen voortgangscode. Een code begint met LAB1.');
  if(som(m[1]) !== m[2]) throw new Error('De code is onvolledig of er zit een tikfout in. Kopieer ze opnieuw.');
  let d; try { d = JSON.parse(b64.van(m[1])); } catch(e){ throw new Error('De code kan niet gelezen worden.'); }
  if(!PADEN.includes(d.p)) throw new Error('De code bevat een onbekend pad.');
  const labs = {};
  for(const lab of HUB.labs){
    const r = (d.l || {})[lab.sleutel]; if(!r) continue;
    const n = lab.haltes.reduce((s, x) => s + x.lessen.length, 0);
    labs[lab.sleutel] = maakVoortgang(lab, hexNaarBits(String(r[0]), n), +r[1] || 0, +r[2] || 0);
  }
  return {klas: String(d.k || '').slice(0, 20), naam: String(d.n || '').slice(0, 30), pad: d.p, dag: +d.d || 0, labs};
}
const datum = dag => new Date(dag * 86400000).toLocaleDateString('nl-BE', {day: 'numeric', month: 'short'});
const schoon = t => String(t).replace(/[<>]/g, '').trim();


/* ===== Lab-hub: klasoverzicht voor de docent =====
   Alles blijft op dit toestel: de codes die je plakt, worden hier bewaard en nergens naartoe gestuurd. */
const DS = HUB.sleutel + '-docent';
let D = bewaard(DS, {klassen: [], rijen: {}, toon: ''});
D.klassen = D.klassen || []; D.rijen = D.rijen || {};
const onthoud = () => bewaar(DS, D);
let melding = null;

const WOORDEN = ['ZON', 'MAAN', 'STER', 'WOLK', 'BOOM', 'VOS', 'UIL', 'BERG', 'ZEE', 'WIND', 'ROOS', 'EIK'];
function nieuweKlas(){
  let c; do { c = WOORDEN[Math.floor(Math.random() * WOORDEN.length)] + '-' + (100 + Math.floor(Math.random() * 900)); } while(D.klassen.includes(c));
  D.klassen.push(c); D.toon = c; onthoud(); melding = null; toon();
}
function voegToe(tekst){
  const stukken = tekst.split(/\s+/).filter(x => x.startsWith('LAB1.'));
  if(!stukken.length){ melding = ['nok', 'Geen voortgangscode gevonden. Een code begint met LAB1.']; return toon(); }
  let goed = 0, nieuw = 0; const fout = [];
  for(const s of stukken){
    try {
      const r = leesCode(s), sleutel = [r.klas, r.naam.toLowerCase(), r.pad].join('|');
      const oud = D.rijen[sleutel];
      if(!oud) nieuw++;
      if(!oud || oud.dag <= r.dag) D.rijen[sleutel] = {klas: r.klas, naam: r.naam, pad: r.pad, dag: r.dag, code: s};
      if(r.klas && !D.klassen.includes(r.klas)) D.klassen.push(r.klas);
      goed++;
    } catch(e){ fout.push(e.message); }
  }
  onthoud();
  melding = fout.length ? ['nok', `${goed} code(s) toegevoegd, ${fout.length} niet gelezen: ${fout[0]}`] : ['ok', `${goed} code(s) gelezen: ${nieuw} nieuw, ${goed - nieuw} bijgewerkt.`];
  toon();
}
const rijenVan = klas => Object.entries(D.rijen).filter(([, r]) => klas === '' || r.klas === klas)
  .map(([k, r]) => { try { return {k, ...r, ...leesCode(r.code)}; } catch(e){ return null; } }).filter(Boolean)
  .sort((a, b) => a.pad.localeCompare(b.pad) || a.naam.localeCompare(b.naam, 'nl'));

function csv(rijen){
  const kop = ['klas', 'schuilnaam', 'pad', 'datum', ...HUB.labs.flatMap(l => [l.naam + ' lessen', l.naam + ' haltes', l.naam + ' score %'])];
  const regels = rijen.map(r => [r.klas, r.naam, PADNAAM[r.pad], new Date(r.dag * 86400000).toLocaleDateString('nl-BE'),
    ...HUB.labs.flatMap(l => { const v = r.labs[l.sleutel]; return v ? [`${v.gedaan}/${v.totaal}`, `${v.haltesKlaar}/${v.haltes.length}`, v.tot ? Math.round(100 * v.goed / v.tot) : ''] : ['', '', '']; })]);
  const t = [kop, ...regels].map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = h('a', {href: URL.createObjectURL(new Blob(['﻿' + t], {type: 'text/csv'})), download: `labs-${D.toon || 'alle-klassen'}.csv`});
  document.body.append(a); a.click(); a.remove();
}

function cel(lab, v){
  if(!v) return h('td', {class: 'klein'}, '–');
  const pct = v.totaal ? Math.round(100 * v.gedaan / v.totaal) : 0;
  return h('td', {style: `--la:${lab.accent}`}, h('div', {class: 'mini', title: v.haltes.map((x, i) => `Halte ${i + 1} ${x.naam}: ${x.klaar}/${x.n}`).join('\n')},
    h('div', {class: 'balk'}, h('i', {style: `width:${pct}%`})), h('span', null, `${v.gedaan}/${v.totaal}`),
    h('span', {class: 'stip', 'aria-label': `${v.haltesKlaar} van ${v.haltes.length} haltes af`}, v.haltes.map(x => h('i', {class: x.n && x.klaar === x.n ? 'af' : ''}))),
    v.tot ? h('span', {class: 'klein'}, Math.round(100 * v.goed / v.tot) + '%') : null));
}

  const rijen = rijenVan(D.toon), plak = h('textarea', {id: 'plak', placeholder: 'LAB1.…', 'aria-describedby': 'plakhulp'});
  const delen = [
    h('header', {class: 'top geenprint'}, h('a', {class: 'merk', href: './'}, h('i', null, HUB.labs.map(l => h('b', {style: `background:${l.accent}`}))), HUB.naam), h('a', {class: 'toplink', href: './'}, '← Naar de labs')),

    h('ol', {class: 'uitleg geenprint'},
      h('li', null, h('b', null, 'Maak een klascode'), 'Schrijf ze op het bord. Ze dient alleen om groepen uit elkaar te houden.'),

      h('li', null, h('b', null, 'Plak ze hier'), 'Eén of meerdere tegelijk. Een nieuwere code van dezelfde deelnemer vervangt de oude.')),
    h('h2', {class: 'geenprint'}, 'Klassen'),
    h('div', {class: 'tabs geenprint'},
      h('button', {type: 'button', 'aria-pressed': String(D.toon === ''), onclick: () => { D.toon = ''; onthoud(); toon(); }}, 'Alle'),

    h('p', {class: 'sub'}, rijen.length ? `${rijen.length} deelnemer(s). De bolletjes tonen de afgewerkte haltes, het percentage is de score op de oefeningen.` : ''),
    h('div', {class: 'tabel'}, rijen.length ? h('table', null,
      h('thead', null, h('tr', null, h('th', null, 'Schuilnaam'), D.toon ? null : h('th', null, 'Klas'), h('th', null, 'Pad'), HUB.labs.map(l => h('th', null, l.naam)), h('th', null, 'Code van'), h('th', {class: 'geenprint'}))),
      h('tbody', null, rijen.map(r => h('tr', null, h('td', null, h('b', null, r.naam)), D.toon ? null : h('td', null, r.klas || '–'), h('td', null, PADNAAM[r.pad]),
        HUB.labs.map(l => cel(l, r.labs[l.sleutel])), h('td', {class: 'klein'}, datum(r.dag)),
        h('td', {class: 'geenprint'}, h('button', {class: 'x', type: 'button', 'aria-label': `Verwijder ${r.naam}`, onclick: () => { delete D.rijen[r.k]; onthoud(); melding = null; toon(); }}, '×'))))))
      : h('div', {class: 'leeg'}, 'Nog geen codes. Plak hierboven de eerste voortgangscode.')),
    rijen.length ? h('div', {class: 'rij geenprint', style: 'margin-top:14px'},
      h('button', {class: 'knop stil klein2', type: 'button', onclick: () => csv(rijen)}, 'Download als CSV (Excel)'),
      h('button', {class: 'knop stil klein2', type: 'button', onclick: () => window.print()}, 'Afdrukken'),
      h('button', {class: 'knop stil klein2', type: 'button', onclick: () => { if(!confirm(D.toon ? `Alle gegevens van ${D.toon} wissen?` : 'Alle gegevens van alle klassen wissen?')) return;
        for(const r of rijen) delete D.rijen[r.k]; if(D.toon){ D.klassen = D.klassen.filter(k => k !== D.toon); D.toon = ''; } else D.klassen = []; onthoud(); melding = null; toon(); }}, D.toon ? 'Wis deze klas' : 'Wis alles')) : null,
    h('footer', null, 'Privacy: deze pagina bewaart de geplakte codes alleen in deze browser, op dit toestel. Er wordt niets naar een server gestuurd. Een code bevat een klascode, een schuilnaam, het pad, een datum en per lab de afgewerkte lessen en de score. Vraag deelnemers om een schuilnaam te kiezen die alleen jij herkent. Een code is niet beveiligd tegen vervalsen: gebruik het overzicht om op te volgen, niet om punten te geven.')
  ];
  $('#app').replaceChildren(...delen.filter(Boolean));
}
toon();
</script>
